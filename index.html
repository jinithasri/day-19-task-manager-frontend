<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #222;
            color: white;
        }

        .task-list {
            list-style: none;
            padding: 0;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .task-title {
            flex: 1;
            font-size: 16px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .complete-btn {
            background: #28a745;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .edit-btn {
            background: #007bff;
            color: white;
        }

        #message {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .task {
                flex-direction: column;
                align-items: stretch;
            }

            .input-section {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Task Manager</h1>

    <div id="message"></div>

    <div class="input-section">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
        >

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>
    </div>

    <ul id="taskList" class="task-list"></ul>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="script.js"></script>

</body>
</html>
