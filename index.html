<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager - Login</title>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 40px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .divider {
            text-align: center;
            font-size: 22px;
            color: #777;
            margin: 25px 0;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📝 Task Manager</h1>


        <!-- ========================= -->
        <!-- LOGIN -->
        <!-- ========================= -->

        <div class="card">

            <h2>🔐 Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >

            <button onclick="login()">
                Login
            </button>

            <div id="loginMessage" class="message"></div>

        </div>


        <div class="divider">
            ───────── OR ─────────
        </div>


        <!-- ========================= -->
        <!-- CREATE ACCOUNT -->
        <!-- ========================= -->

        <div class="card">

            <h2>📝 Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Enter your password"
            >

            <button onclick="createAccount()">
                Create Account
            </button>

            <div id="signupMessage" class="message"></div>

        </div>

    </div>


    <!-- IMPORTANT -->
    <!-- JavaScript must be loaded AFTER the HTML -->

    <script src="script.js"></script>

</body>

</html>
