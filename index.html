<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #categorySelect {
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .add-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn:hover {
            background: #444;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px;
            margin-bottom: 12px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .category {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            background: #ddd;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .complete-btn {
            background: #28a745;
        }

        .edit-btn {
            background: #007bff;
        }

        .delete-btn {
            background: #dc3545;
        }

        @media (max-width: 700px) {
            .input-area {
                flex-direction: column;
            }

            .task {
                flex-direction: column;
                align-items: stretch;
            }

            .buttons {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📝 Task Manager</h1>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <select id="categorySelect">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Urgent">Urgent</option>
            </select>

            <button class="add-btn" onclick="addTask()">
                Add Task
            </button>

        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
